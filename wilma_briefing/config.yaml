name: Wilma Briefing
version: "0.2.0"
slug: wilma_briefing
description: Wilma school schedule, homework and unread messages as Home Assistant entities
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
homeassistant_api: true
services:
  - mqtt:need
options:
  wilma_tenant: ""
  wilma_username: ""
  wilma_password: ""
  language: fi
  name_display: first
  cutoff_time: "16:00"
  days_ahead: 1
  homework_lookback_days: 7
  refresh_interval_minutes: 60
  active_hours_start: "06:30"
  active_hours_end: "21:30"
  notify_enabled: true
  notify_services: []
schema:
  wilma_tenant: str
  wilma_username: str
  wilma_password: password
  wilma_totp_secret: password?
  language: list(fi|en)
  name_display: list(first|full)
  cutoff_time: "match(^([01]?[0-9]|2[0-3]):[0-5][0-9]$)"
  days_ahead: int(1,5)
  homework_lookback_days: int(1,21)
  refresh_interval_minutes: int(15,240)
  active_hours_start: "match(^([01]?[0-9]|2[0-3]):[0-5][0-9]$)"
  active_hours_end: "match(^([01]?[0-9]|2[0-3]):[0-5][0-9]$)"
  notify_enabled: bool
  notify_services:
    - str
